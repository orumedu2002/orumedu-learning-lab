name: Verify post thumbnails

on:
  pull_request:
    paths:
      - "_posts/**"
      - "assets/images/**"
      - "scripts/verify_post_thumbnails.py"
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "assets/images/**"
      - "scripts/verify_post_thumbnails.py"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify thumbnail metadata and assets
        run: python scripts/verify_post_thumbnails.py
