---
layout: default
---
<article class="article-shell">
  <header class="article-header">
    <p class="eyebrow">{{ page.categories | join: " · " | upcase }}</p>
    <h1>{{ page.title }}</h1>
    <p class="article-deck">{{ page.description }}</p>
    <div class="article-byline">
      <span>{{ page.author | default: site.author.name }}</span>
      <span aria-hidden="true">·</span>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %m월 %d일" }}</time>
    </div>
  </header>
  <div class="article-body">{{ content }}</div>
  <footer class="article-footer">
    <p>교육채널 오름은 연구 근거와 교육 현장의 적용 가능성, 그리고 그 한계를 함께 다룹니다.</p>
    <a class="text-link" href="{{ '/methodology/' | relative_url }}">운영 원칙 보기 <span aria-hidden="true">›</span></a>
  </footer>
</article>
