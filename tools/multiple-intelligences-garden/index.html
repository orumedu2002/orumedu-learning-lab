<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>다중지능 꽃밭 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F2FB;
    --surface: #FFFFFF;
    --ink: #2B2640;
    --muted: #7A7390;
    --line: #E7E1F5;
    --cta: #FF6F59;
    --cta-ink: #FFFFFF;

    --c-lang: #FF6F59;
    --c-math: #F4A300;
    --c-space: #3AA6FF;
    --c-body: #2ECC71;
    --c-music: #A66DD4;
    --c-inter: #FF5C93;
    --c-intra: #17A2A2;
    --c-nature: #7CB342;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 10%, #EFE9FF 0%, transparent 40%),
      radial-gradient(circle at 92% 85%, #FFF3E6 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    min-height:100vh;
    padding:28px 14px 60px;
  }
  h1,h2,h3,.display{ font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400; }
  .wrap{ max-width:720px; margin:0 auto; }

  /* ---------- Flower progress ---------- */
  .flower-zone{ display:flex; flex-direction:column; align-items:center; margin-bottom:22px; }
  .flower-caption{ font-size:13px; color:var(--muted); margin-top:6px; letter-spacing:.02em; }
  .petal{ transition: fill .5s ease, opacity .5s ease; }
  .petal.active{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:26px;
    box-shadow: 0 10px 30px -18px rgba(43,38,64,.35);
  }
  .eyebrow{
    display:inline-block; font-size:13px; color:var(--muted);
    background:#F1EDFB; border-radius:999px; padding:4px 12px; margin-bottom:10px;
  }
  h1.title{ font-size:30px; margin:0 0 8px; }
  p.lede{ color:var(--muted); font-size:15px; line-height:1.6; margin:0 0 22px; }

  /* ---------- Intro form ---------- */
  .field{ margin-bottom:16px; }
  label{ display:block; font-size:14px; color:var(--muted); margin-bottom:6px; }
  input[type=text], select{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
    font-family:inherit; font-size:15px; background:#FBFAFF; color:var(--ink);
  }
  input:focus, select:focus{ outline:2px solid #C9BCF2; border-color:#C9BCF2; }
  .radio-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-pill{
    padding:10px 16px; border-radius:999px; border:1.5px solid var(--line);
    cursor:pointer; font-size:14px; color:var(--muted); user-select:none;
  }
  .radio-pill.picked{ background:var(--ink); color:#fff; border-color:var(--ink); }

  button{ font-family:'Jua','Noto Sans KR',sans-serif; cursor:pointer; border:none; }
  .btn-primary{
    background:var(--cta); color:var(--cta-ink); padding:14px 26px; border-radius:14px;
    font-size:17px; width:100%; box-shadow:0 10px 22px -10px rgba(255,111,89,.6);
  }
  .btn-primary:disabled{ background:#DAD4EC; color:#9C93B8; box-shadow:none; cursor:not-allowed; }
  .btn-ghost{
    background:transparent; color:var(--muted); padding:12px 18px; border-radius:12px; font-size:15px;
  }
  .btn-row{ display:flex; gap:10px; align-items:center; margin-top:22px; }

  /* ---------- Domain header ---------- */
  .domain-band{
    display:flex; align-items:center; gap:12px; padding:14px 18px; border-radius:18px; margin-bottom:18px;
    color:#fff;
  }
  .domain-band .emoji{ font-size:30px; }
  .domain-band .name{ font-size:22px; }
  .domain-band .desc{ font-size:13px; opacity:.9; margin-top:2px; }

  .progress-bar{ height:8px; border-radius:999px; background:#EDE8FB; overflow:hidden; margin-bottom:20px; }
  .progress-fill{ height:100%; border-radius:999px; transition:width .4s ease; }

  /* ---------- Question ---------- */
  .q-item{ padding:16px 0; border-bottom:1px solid var(--line); }
  .q-item:last-child{ border-bottom:none; }
  .q-num{ font-size:12px; color:var(--muted); margin-bottom:4px; }
  .q-text{ font-size:15.5px; line-height:1.55; margin-bottom:12px; }
  .scale-row{ display:flex; gap:6px; justify-content:space-between; }
  .scale-btn{
    flex:1; padding:10px 4px; border-radius:12px; border:1.5px solid var(--line);
    background:#FBFAFF; font-size:12px; color:var(--muted); text-align:center; line-height:1.3;
  }
  .scale-btn b{ display:block; font-size:15px; margin-bottom:2px; font-family:'Jua',sans-serif; color:var(--ink); }
  .scale-btn.picked{ color:#fff; border-color:transparent; }
  .scale-btn.picked b{ color:#fff; }

  .section-progress-note{ font-size:13px; color:var(--muted); text-align:center; margin-top:14px; }

  /* ---------- Results ---------- */
  .score-row{ display:flex; align-items:center; gap:12px; padding:10px 0; }
  .score-row .dot{ width:14px; height:14px; border-radius:50%; flex:none; }
  .score-row .label{ width:98px; font-size:14px; flex:none; }
  .score-track{ flex:1; height:12px; border-radius:999px; background:#EDE8FB; overflow:hidden; }
  .score-fill{ height:100%; border-radius:999px; }
  .score-val{ width:44px; text-align:right; font-size:13px; color:var(--muted); flex:none; }

  .tag-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0; }
  @media (max-width:520px){ .tag-grid{ grid-template-columns:1fr; } }
  .tag-card{ border-radius:16px; padding:16px; color:#fff; }
  .tag-card .kind{ font-size:12px; opacity:.85; margin-bottom:4px;}
  .tag-card .dname{ font-size:19px; margin-bottom:6px; }
  .tag-card .tip{ font-size:13px; line-height:1.5; opacity:.95; }

  .letter{
    background:#FFF9EF; border:1.5px dashed #F2D9A8; border-radius:16px; padding:20px;
    font-size:15px; line-height:1.75; margin-top:18px; white-space:pre-line;
  }
  .letter .sig{ text-align:right; color:var(--muted); font-size:13px; margin-top:10px; }

  .footer-note{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:26px; line-height:1.6; }
  a.reset-link{ color:var(--ink); }
</style>
</head>

function petalPositions(cx,cy,r){
  return DOMAINS.map((d,i)=>{
    const angle = -90 + i*45;
    return angle;
  });
}
function domainComplete(i){ return answers[i].every(v=>v>0); }
function domainScore(i){ return answers[i].reduce((a,b)=>a+b,0); }

  const cx=90, cy=90, ry=34, rx=15, dist=34;

    const isActive = (activeIdx===i);

    petals += `<g transform="rotate(${angle} ${cx} ${cy})">
      <ellipse class="petal${isActive?' active':''}" cx="${cx}" cy="${cy-dist}" rx="${rx}" ry="${ry}"
        fill="${fill}" stroke="${isActive?d.hex:'transparent'}" stroke-width="${isActive?2:0}"/>
    </g>`;
  });
  const center = (typeof activeIdx==='number') ? (activeIdx+1)+' / 8' : '🌼';
  return `<svg width="180" height="180" viewBox="0 0 180 180">
    ${petals}
    <circle cx="${cx}" cy="${cy}" r="22" fill="#fff" stroke="#EDE8FB" stroke-width="2"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="Jua" font-size="15" fill="#2B2640">${center}</text>
  </svg>`;
}

function radarSVG(scores){
  const size=320, cx=size/2, cy=size/2, maxR=110, maxVal=50;
  const n=DOMAINS.length;
  function pt(i,val){
    const angle = -90 + i*(360/n);
    const rad = angle*Math.PI/180;
    const r = (val/maxVal)*maxR;
    return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
  }
  let grid='';
  [0.2,0.4,0.6,0.8,1].forEach(f=>{
    let pts=[];
    for(let i=0;i<n;i++){ pts.push(pt(i,maxVal*f).join(',')); }
    grid += `<polygon points="${pts.join(' ')}" fill="none" stroke="#EDE8FB" stroke-width="1"/>`;
  });
  let axes='', labels='';
  DOMAINS.forEach((d,i)=>{
    const [x,y]=pt(i,maxVal);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#EDE8FB" stroke-width="1"/>`;
    const [lx,ly]=pt(i,maxVal*1.22);
    labels += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" fill="#2B2640" font-family="Noto Sans KR">${d.emoji}</text>`;
  });
  let dataPts = scores.map((s,i)=>pt(i,s).join(',')).join(' ');
  let dots='';
  scores.forEach((s,i)=>{
    const [x,y]=pt(i,s);
    dots += `<circle cx="${x}" cy="${y}" r="4.5" fill="${DOMAINS[i].hex}"/>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${grid}${axes}
    <polygon points="${dataPts}" fill="#9B72CF" fill-opacity="0.22" stroke="#9B72CF" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

/* ============ RENDERERS ============ */
function render(){
  if(screen==='intro') return renderIntro();
  if(screen==='result') return renderResult();
  return renderDomain(screen);
}

function renderIntro(){
  app.innerHTML = `
    <div class="flower-zone">${flowerSVG(null)}<div class="flower-caption">여덟 빛깔 지능의 씨앗을 심어볼까요?</div></div>
    <div class="card">
      <span class="eyebrow">1단계 · 8영역 · 80문항</span>
      <h1 class="title">다중지능 꽃밭 검사</h1>
      <p class="lede">아이가 가진 여덟 가지 지능 중 어떤 꽃이 가장 활짝 피어있는지 살펴봐요. 정답은 없어요, 평소 모습 그대로 답해주세요.</p>

      <div class="field">
        <label>유아 이름</label>
        <input id="in-name" type="text" placeholder="예: 김하늘" value="${child.name}">
      </div>
      <div class="field">
        <label>성별</label>
        <div class="radio-row" id="gender-row">
          ${['남','여'].map(g=>`<div class="radio-pill ${child.gender===g?'picked':''}" data-g="${g}">${g}</div>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>평가자</label>
        <div class="radio-row" id="eval-row">
          ${['부모','교사','기타'].map(g=>`<div class="radio-pill ${child.evaluator===g?'picked':''}" data-e="${g}">${g}</div>`).join('')}
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="start-btn">검사 시작하기 🌱</button>
      </div>
    </div>
    <div class="footer-note">총 8개 영역 · 영역당 10문항 · 중간에 이전 영역으로 돌아갈 수 있어요.<br>이 도구는 영유아의 일상 관찰을 돕는 교육적 참고 자료이며, 표준화 심리검사·발달진단 또는 의료적 판단을 대체하지 않습니다. 입력한 이름과 응답은 이 브라우저 안에서만 처리되며 서버에 저장·전송되지 않습니다.</div>
  `;
  document.getElementById('in-name').oninput = e => child.name = e.target.value;
  document.querySelectorAll('#gender-row .radio-pill').forEach(el=>{
    el.onclick = ()=>{ child.gender = el.dataset.g; renderIntro(); };
  });
  document.querySelectorAll('#eval-row .radio-pill').forEach(el=>{
    el.onclick = ()=>{ child.evaluator = el.dataset.e; renderIntro(); };
  });
  document.getElementById('start-btn').onclick = ()=>{ screen = 0; render(); };
}

function renderDomain(idx){
  const d = DOMAINS[idx];
  const answered = answers[idx].filter(v=>v>0).length;
  const total = d.questions.length;
  const pct = Math.round((idx + answered/total) / DOMAINS.length * 100);

  app.innerHTML = `
    <div class="flower-zone">${flowerSVG(idx)}<div class="flower-caption">${idx+1}번째 꽃잎 · ${d.name} 채우는 중</div></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${d.hex}"></div></div>
    <div class="card">
      <div class="domain-band" style="background:${d.hex}">
        <div class="emoji">${d.emoji}</div>
        <div><div class="name">${d.name}</div><div class="desc">${d.desc}</div></div>
      </div>
      <div id="q-list">
        ${d.questions.map((q,qi)=>`
          <div class="q-item">
            <div class="q-num">${qi+1} / ${total}</div>
            <div class="q-text">${q}</div>
            <div class="scale-row" data-qi="${qi}">
              ${SCALE.map((label,si)=>`
                <div class="scale-btn ${answers[idx][qi]===si+1?'picked':''}" data-si="${si+1}" style="${answers[idx][qi]===si+1?`background:${d.hex};border-color:${d.hex}`:''}">
                  <b>${si+1}</b>${label}
                </div>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      <div class="section-progress-note">${answered} / ${total} 문항 완료</div>
      <div class="btn-row">
        ${idx>0 ? `<button class="btn-ghost" id="prev-btn">← 이전 영역</button>` : `<span></span>`}
        <button class="btn-primary" id="next-btn" ${answered<total?'disabled':''}>
          ${idx===DOMAINS.length-1 ? '결과 보기 🌸' : '다음 영역 →'}
        </button>
      </div>
    </div>
  `;

  document.querySelectorAll('#q-list .scale-row').forEach(row=>{
    const qi = +row.dataset.qi;
    row.querySelectorAll('.scale-btn').forEach(btn=>{
      btn.onclick = ()=>{
        answers[idx][qi] = +btn.dataset.si;
        renderDomain(idx);
      };
    });
  });
  if(idx>0) document.getElementById('prev-btn').onclick = ()=>{ screen = idx-1; render(); };
  document.getElementById('next-btn').onclick = ()=>{
    if(answered<total) return;
    screen = (idx===DOMAINS.length-1) ? 'result' : idx+1;
    render();
    window.scrollTo(0,0);
  };
}

function renderResult(){
  const scores = DOMAINS.map((d,i)=>domainScore(i));
  const ranked = DOMAINS.map((d,i)=>({...d, score:scores[i], idx:i})).sort((a,b)=>b.score-a.score);
  const strengths = ranked.slice(0,2);
  const weaknesses = ranked.slice(-1);
  const name = child.name || '아이';

  const letterText = `${name}(이)는 ${strengths.map(s=>s.name).join(', ')} 이(가) 유독 반짝이는 꽃잎으로 나타났어요. ${strengths[0].strengthTip}

아직 봉오리 상태인 ${weaknesses[0].name}은(는) 조급해하지 않아도 괜찮아요. ${weaknesses[0].bridgeTip}
${strengths[0].name}(을)를 좋아하는 마음을 살짝 빌려와 놀이처럼 다가가면, ${name}만의 속도로 무럭무럭 자랄 거예요.`;

  app.innerHTML = `
    <div class="flower-zone">${flowerSVG(null)}<div class="flower-caption">여덟 꽃잎이 모두 피었어요 🌸</div></div>
    <div class="card">
      <span class="eyebrow">검사 결과</span>
      <h1 class="title">${name}의 다중지능 꽃밭</h1>
      <p class="lede">평가자: ${child.evaluator} · 8개 영역 · 각 50점 만점</p>

      <div style="display:flex; justify-content:center; margin-bottom:10px;">${radarSVG(scores)}</div>

      <div id="score-list">
        ${ranked.map(d=>`
          <div class="score-row">
            <div class="dot" style="background:${d.hex}"></div>
            <div class="label">${d.emoji} ${d.name}</div>
            <div class="score-track"><div class="score-fill" style="width:${d.score/50*100}%;background:${d.hex}"></div></div>
            <div class="score-val">${d.score}/50</div>
          </div>
        `).join('')}
      </div>

      <div class="tag-grid">
        ${strengths.map(s=>`
          <div class="tag-card" style="background:${s.hex}">
            <div class="kind">💪 강점지능</div>
            <div class="dname">${s.emoji} ${s.name}</div>
            <div class="tip">${s.strengthTip}</div>
          </div>`).join('')}
        ${weaknesses.map(s=>`
          <div class="tag-card" style="background:#B9B2CE">
            <div class="kind">🌱 보완지능</div>
            <div class="dname">${s.emoji} ${s.name}</div>
            <div class="tip">${s.bridgeTip}</div>
          </div>`).join('')}
      </div>

      <div class="letter">${letterText}<div class="sig">— 다중지능 꽃밭 검사 드림</div></div>

      <div class="btn-row">
        <button class="btn-primary" id="restart-btn">처음부터 다시 검사하기</button>
      </div>
    </div>
    <div class="footer-note">이 결과는 강점과 보완점의 참고 자료이며, 지능의 높고 낮음을 평가하는 것이 아니에요.<br>2년 주기로 다시 검사해보면 자라나는 변화를 볼 수 있어요.</div>
  `;
  document.getElementById('restart-btn').onclick = ()=>{
    answers = DOMAINS.map(d => Array(d.questions.length).fill(0));
    screen = 'intro';
    render();
    window.scrollTo(0,0);
  };
}

render();
</script>
